<!doctype html>
<html lang="en" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UtsavAI — GenAI-powered celebration planner for Indian families. Budget, timeline, vendors and Plan Rescue in one connected plan." />
    <meta name="theme-color" content="#FBF5EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1410" media="(prefers-color-scheme: dark)" />
    <title>UtsavAI — GenAI Celebration Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Prevent theme flash: read localStorage before React loads -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('utsavai_theme');
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
