steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Type-check client and server
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'type-check']

  # 3. Execute unit and integration tests
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']

  # 4. Production build
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 5. Build Docker container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/utsavai:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/utsavai:latest', '.']

  # 6. Push container to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/utsavai:$COMMIT_SHA']

  # 7. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'utsavai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/utsavai:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/utsavai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/utsavai:latest'

